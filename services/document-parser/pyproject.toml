[project]
name = "document-parser"
version = "0.1.0"
description = "Memora 内部文档解析服务：PDF/DOCX → ParsedDocument（基于 Docling）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.10,<3",
    "docling[rapidocr]>=2.118,<3",
    "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
