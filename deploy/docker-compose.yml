name: memora

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes:
      - memora-postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["memora-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEMORA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEMORA_MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["memora-minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MEMORA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEMORA_MINIO_SECRET_KEY:-minioadmin}
      MEMORA_MINIO_BUCKET: ${MEMORA_MINIO_BUCKET:-memora}
    entrypoint: ["/bin/sh", "-c"]
    command: ['mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing "local/$${MEMORA_MINIO_BUCKET}"']
    restart: "no"

  migrate:
    build: {context: .., dockerfile: Dockerfile}
    command: ["memora-migrate", "up"]
    environment: &memora-environment
      MEMORA_GIN_MODE: ${MEMORA_GIN_MODE:-debug}
      MEMORA_HTTP_ADDRESS: ":8080"
      MEMORA_DATABASE_URL: "postgres://memora:password@postgres:5432/memora?sslmode=disable"
      MEMORA_REDIS_ADDRESS: "redis:6379"
      MEMORA_REDIS_DB: ${MEMORA_REDIS_DB:-3}
      MEMORA_MINIO_ENDPOINT: "minio:9000"
      MEMORA_MINIO_ACCESS_KEY: ${MEMORA_MINIO_ACCESS_KEY:-minioadmin}
      MEMORA_MINIO_SECRET_KEY: ${MEMORA_MINIO_SECRET_KEY:-minioadmin}
      MEMORA_MINIO_BUCKET: ${MEMORA_MINIO_BUCKET:-memora}
      MEMORA_MINIO_USE_SSL: "false"
      MEMORA_JWT_SECRET: ${MEMORA_JWT_SECRET:?MEMORA_JWT_SECRET must be set}
      MEMORA_ACCESS_TTL: ${MEMORA_ACCESS_TTL:-2h}
      MEMORA_DOCUMENT_CONSUMER_ENABLED: ${MEMORA_DOCUMENT_CONSUMER_ENABLED:-true}
      MEMORA_DOCUMENT_CONSUMER_STREAM: ${MEMORA_DOCUMENT_CONSUMER_STREAM:-memora:document:parse}
      MEMORA_DOCUMENT_CONSUMER_GROUP: ${MEMORA_DOCUMENT_CONSUMER_GROUP:-memora-api}
      MEMORA_DOCUMENT_CONSUMER_CONCURRENCY: ${MEMORA_DOCUMENT_CONSUMER_CONCURRENCY:-2}
      MEMORA_DOCUMENT_CONSUMER_BLOCK_TIMEOUT: ${MEMORA_DOCUMENT_CONSUMER_BLOCK_TIMEOUT:-5s}
      MEMORA_DOCUMENT_CONSUMER_PROCESSING_TIMEOUT: ${MEMORA_DOCUMENT_CONSUMER_PROCESSING_TIMEOUT:-15m}
      MEMORA_DOCUMENT_CONSUMER_CLAIM_IDLE: ${MEMORA_DOCUMENT_CONSUMER_CLAIM_IDLE:-20m}
      MEMORA_DOCUMENT_CONSUMER_MAX_ATTEMPTS: ${MEMORA_DOCUMENT_CONSUMER_MAX_ATTEMPTS:-3}
      MEMORA_OUTBOX_POLL_INTERVAL: ${MEMORA_OUTBOX_POLL_INTERVAL:-500ms}
      MEMORA_OUTBOX_BATCH_SIZE: ${MEMORA_OUTBOX_BATCH_SIZE:-100}
      MEMORA_DOCUMENT_PARSER_BASE_URL: "http://document-parser:5001"
      MEMORA_DOCUMENT_PARSER_TIMEOUT: ${MEMORA_DOCUMENT_PARSER_TIMEOUT:-8m}
      MEMORA_DOCUMENT_PARSER_MAX_RESPONSE_SIZE: ${MEMORA_DOCUMENT_PARSER_MAX_RESPONSE_SIZE:-134217728}
      MEMORA_DOCUMENT_PARSER_MAX_FILE_BYTES: ${MEMORA_DOCUMENT_PARSER_MAX_FILE_BYTES:-67108864}
      MEMORA_DOCUMENT_PARSER_MAX_ASSET_BYTES: ${MEMORA_DOCUMENT_PARSER_MAX_ASSET_BYTES:-33554432}
      MEMORA_DOCUMENT_PARSER_OCR_LANGUAGES: ${MEMORA_DOCUMENT_PARSER_OCR_LANGUAGES:-zh,en}
      MEMORA_DOCUMENT_PARSER_DO_OCR: ${MEMORA_DOCUMENT_PARSER_DO_OCR:-true}
      MEMORA_DOCUMENT_PARSER_TABLE_STRUCTURE: ${MEMORA_DOCUMENT_PARSER_TABLE_STRUCTURE:-true}
      MEMORA_DOCUMENT_PARSER_EXTRACT_PICTURES: ${MEMORA_DOCUMENT_PARSER_EXTRACT_PICTURES:-true}
      MEMORA_DOCUMENT_PARSER_INCLUDE_BBOXES: ${MEMORA_DOCUMENT_PARSER_INCLUDE_BBOXES:-true}
      MEMORA_CHUNKING_STRATEGY_VERSION: ${MEMORA_CHUNKING_STRATEGY_VERSION:-structure-v1}
      MEMORA_CHUNKING_MAX_TOKENS: ${MEMORA_CHUNKING_MAX_TOKENS:-1000}
      MEMORA_CHUNKING_MIN_TOKENS: ${MEMORA_CHUNKING_MIN_TOKENS:-100}
      MEMORA_CHUNKING_OVERLAP_TOKENS: ${MEMORA_CHUNKING_OVERLAP_TOKENS:-100}
      MEMORA_CHUNKING_REPEAT_TABLE_HEADER: ${MEMORA_CHUNKING_REPEAT_TABLE_HEADER:-true}
      MEMORA_ASSET_ENRICHMENT_MODE: ${MEMORA_ASSET_ENRICHMENT_MODE:-none}
      MEMORA_ASSET_ENRICHMENT_TIMEOUT: ${MEMORA_ASSET_ENRICHMENT_TIMEOUT:-2m}
      MEMORA_BOOTSTRAP_ADMIN_USERNAME: ${MEMORA_BOOTSTRAP_ADMIN_USERNAME:-admin}
      MEMORA_BOOTSTRAP_ADMIN_EMAIL: ${MEMORA_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      MEMORA_BOOTSTRAP_ADMIN_PASSWORD: ${MEMORA_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  bootstrap-admin:
    build: {context: .., dockerfile: Dockerfile}
    command: ["memora-migrate", "bootstrap-admin"]
    environment: *memora-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  api:
    build: {context: .., dockerfile: Dockerfile}
    command: ["memora-server"]
    environment: *memora-environment
    ports: ["8080:8080"]
    depends_on: &application-dependencies
      bootstrap-admin: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      default:
        aliases: [memora-server]

  document-parser:
    build: {context: ../services/document-parser, dockerfile: Dockerfile}
    environment:
      DOCUMENT_PARSER_LOG_LEVEL: info
      DOCUMENT_PARSER_MAX_CONCURRENCY: ${DOCUMENT_PARSER_MAX_CONCURRENCY:-2}
      HF_HOME: /models/huggingface
    volumes:
      - docling-models:/models/huggingface
    ports: ["5001:5001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  web:
    build: {context: ../web, dockerfile: Dockerfile}
    ports: ["3000:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  memora-postgres:
  memora-redis:
  memora-minio:
  docling-models:
