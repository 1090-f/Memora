services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - memora-postgres:/var/lib/postgresql/data

volumes:
  memora-postgres:
